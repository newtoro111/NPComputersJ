name: np-computers
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: npcomputers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
      DB_PASSWORD: ${DB_PASSWORD:?Run setup first}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Run setup first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./roles.sql:/opt/np/roles.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d npcomputers']
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: flyway/flyway:11.13.2
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/npcomputers
      FLYWAY_USER: np_migrate
      FLYWAY_PASSWORD: ${MIGRATION_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/npcomputers
      DB_PASSWORD: ${DB_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
      SPRING_FLYWAY_ENABLED: 'false'
      JWT_PRIVATE_KEY: /run/secrets/private.pem
      JWT_PUBLIC_KEY: /run/secrets/public.pem
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ../secrets:/run/secrets:ro
    networks: [application, database]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://localhost:8080/actuator/health/readiness || exit 1']
      start_period: 60s
      interval: 10s
      retries: 12
    restart: unless-stopped
  web:
    build: ../frontend
    ports: ['127.0.0.1:8080:8080']
    networks: [application]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/ || exit 1']
      interval: 10s
    restart: unless-stopped
networks:
  application:
  database:
    internal: true
volumes:
  db-data:
