server {
 listen 8080;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Correlation-ID $http_x_correlation_id; }
 location /actuator/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
